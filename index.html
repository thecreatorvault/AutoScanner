<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DocScan Pro | Multi-Page Scanner</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- OpenCV.js & jsPDF -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0b0f19;
      --surface: rgba(23, 31, 48, 0.9);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --accent: #0ea5e9;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 12px;
      border-radius: 9999px;
      background: rgba(79, 70, 229, 0.2);
      border: 1px solid rgba(79, 70, 229, 0.4);
      font-size: 11px;
      font-weight: 500;
      color: #c7d2fe;
      margin-bottom: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fbbf24;
      animation: pulse 1.5s infinite;
    }
    .dot.ready { background: var(--success); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f1f5f9;
    }

    .app-card {
      width: 100%;
      max-width: 500px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .viewer {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #cropCanvas, #outputCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      cursor: crosshair;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 16px;
    }

    /* Fixed Horizontal Scrollable Pages Tray */
    .pages-tray-container {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 8px;
      border: 1px solid var(--border);
    }

    .pages-tray-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .pages-scroll {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
      padding: 4px 2px 8px 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) transparent;
    }

    .pages-scroll::-webkit-scrollbar {
      height: 5px;
    }
    .pages-scroll::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }

    .page-thumb-wrapper {
      position: relative;
      flex: 0 0 65px;
      height: 85px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #1e293b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .page-thumb-wrapper.active {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(14, 165, 233, 0.5);
    }

    .page-thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-badge {
      position: absolute;
      bottom: 2px;
      left: 2px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 700;
    }

    .thumb-del-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(239, 68, 68, 0.85);
      color: #fff;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-primary { background: var(--primary); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
      color: #e2e8f0;
    }
    .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }

    .btn-success { background: var(--success); }
    .btn-success:hover:not(:disabled) { background: #059669; }

    .btn-accent { background: var(--accent); }
    .btn-accent:hover:not(:disabled) { background: #0284c7; }

    /* Filters toggler bar */
    .filter-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 2px 0;
    }

    .filter-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .filter-chip.active {
      background: rgba(79, 70, 229, 0.3);
      border-color: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="dot" id="cvStatusDot"></span>
      <span id="cvStatusText">Vision Engine Loading...</span>
    </div>
    <h1>Document Edge Scanner</h1>
  </header>

  <main class="app-card">
    <!-- Fullscreen App Mode Button -->
    <button class="btn btn-secondary" id="btnFullscreen" onclick="enterAppMode()" style="width: 100%;">
      <i data-lucide="maximize"></i> Fullscreen App Mode
    </button>

    <div class="viewer" id="viewerBox">
      <div id="placeholder" class="empty-state">
        <i data-lucide="scan" style="width: 38px; height: 38px;"></i>
        <span>Document camera frame me rakhein ya photo upload karein</span>
      </div>

      <video id="video" autoplay playsinline muted></video>
      <canvas id="cropCanvas"></canvas>
      <canvas id="outputCanvas"></canvas>
    </div>

    <!-- Hidden Raw Original Image Canvas -->
    <canvas id="rawCanvas" style="display: none;"></canvas>

    <!-- Horizontal Scrollable Multi-Page Thumbnail Bar -->
    <div class="pages-tray-container" id="pagesTray">
      <div class="pages-tray-header">
        <span>Scanned Pages (<span id="pageCount">0</span>)</span>
        <span style="font-size: 11px;">👈 Swipe horizontally 👉</span>
      </div>
      <div class="pages-scroll" id="pagesList"></div>
    </div>

    <!-- Filters Bar -->
    <div class="filter-bar" id="filterBar">
      <span class="filter-chip active" id="chipColor" onclick="applyFilter('color')">Original</span>
      <span class="filter-chip" id="chipMagic" onclick="applyFilter('magic')">Magic Color</span>
      <span class="filter-chip" id="chipBw" onclick="applyFilter('bw')">B&W Doc</span>
    </div>

    <div class="controls">
      <!-- State 1: Input Actions -->
      <div class="btn-group" id="inputActionGroup">
        <button id="btnCamera" class="btn btn-primary" onclick="initCamera()" disabled>
          <i data-lucide="video"></i> Camera
        </button>
        <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()" id="btnUpload" disabled>
          <i data-lucide="upload"></i> Upload
        </button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
      </div>

      <!-- State 2: Snap Photo -->
      <button id="btnCapture" class="btn btn-primary" onclick="captureSnapshot()" style="display: none;">
        <i data-lucide="camera"></i> Snap Photo
      </button>

      <!-- State 3: Confirm Crop Step -->
      <div class="btn-group" id="confirmActionGroup" style="display: none;">
        <button class="btn btn-secondary" onclick="cancelCurrentCrop()">
          <i data-lucide="x"></i> Cancel
        </button>
        <button class="btn btn-accent" onclick="applyPerspectiveCrop()">
          <i data-lucide="crop"></i> Confirm Crop
        </button>
      </div>

      <!-- State 4: Export & Add Page Step -->
      <div class="btn-group" id="exportActionGroup" style="display: none;">
        <button class="btn btn-secondary" onclick="addNewPageCamera()">
          <i data-lucide="plus-circle"></i> Add Page
        </button>
        <button class="btn btn-accent" onclick="sharePDF()">
          <i data-lucide="share-2"></i> Share
        </button>
        <button class="btn btn-success" onclick="downloadPDF()">
          <i data-lucide="file-down"></i> Save PDF
        </button>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const video = document.getElementById('video');
    const cropCanvas = document.getElementById('cropCanvas');
    const outputCanvas = document.getElementById('outputCanvas');
    const rawCanvas = document.getElementById('rawCanvas');
    const placeholder = document.getElementById('placeholder');
    const filterBar = document.getElementById('filterBar');
    const pagesTray = document.getElementById('pagesTray');
    const pagesList = document.getElementById('pagesList');
    const pageCount = document.getElementById('pageCount');

    const btnCamera = document.getElementById('btnCamera');
    const btnUpload = document.getElementById('btnUpload');
    const btnCapture = document.getElementById('btnCapture');
    const inputActionGroup = document.getElementById('inputActionGroup');
    const confirmActionGroup = document.getElementById('confirmActionGroup');
    const exportActionGroup = document.getElementById('exportActionGroup');
    const fileInput = document.getElementById('fileInput');

    let stream = null;
    let corners = []; 
    let activeCornerIndex = -1;
    let croppedMatColor = null;

    // Multi-Page Array
    let scannedPages = []; // [{ dataUrl, width, height }]
    let activePageIndex = -1;
    let isUserFullscreenRequested = false;

    // 1. Maintain Fullscreen without dropping on camera start
    function isCurrentlyFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    function ensureFullscreenPersistent() {
      if (isUserFullscreenRequested && !isCurrentlyFullscreen()) {
        const elem = document.documentElement;
        try {
          if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
          else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        } catch(e) {}
      }
    }

    function enterAppMode() {
      const elem = document.documentElement;
      if (!isCurrentlyFullscreen()) {
        isUserFullscreenRequested = true;
        if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        document.getElementById('btnFullscreen').innerHTML = '<i data-lucide="minimize"></i> Exit Fullscreen';
      } else {
        isUserFullscreenRequested = false;
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        document.getElementById('btnFullscreen').innerHTML = '<i data-lucide="maximize"></i> Fullscreen App Mode';
      }
      lucide.createIcons();
    }

    document.addEventListener('fullscreenchange', () => {
      if (!isCurrentlyFullscreen() && !isUserFullscreenRequested) {
        document.getElementById('btnFullscreen').innerHTML = '<i data-lucide="maximize"></i> Fullscreen App Mode';
        lucide.createIcons();
      }
    });

    // 2. OpenCV Loaded
    function onOpenCvReady() {
      document.getElementById('cvStatusDot').classList.add('ready');
      document.getElementById('cvStatusText').innerText = "Vision AI Ready";
      btnCamera.disabled = false;
      btnUpload.disabled = false;
    }

    // 3. Camera Start with Resolution Preference
    async function initCamera() {
      try {
        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 2560 },
            height: { ideal: 1440 }
          },
          audio: false
        };

        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }

        video.srcObject = stream;
        await video.play();

        // Ensure fullscreen doesn't drop after stream attaches
        ensureFullscreenPersistent();

        video.style.display = "block";
        placeholder.style.display = "none";
        cropCanvas.style.display = "none";
        outputCanvas.style.display = "none";

        inputActionGroup.style.display = "none";
        exportActionGroup.style.display = "none";
        btnCapture.style.display = "inline-flex";
      } catch (err) {
        alert("Camera Error: " + err.message);
      }
    }

    // 4. File Upload
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          stopCamera();
          setupImageForCrop(img);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 5. Capture Snapshot
    function captureSnapshot() {
      rawCanvas.width = video.videoWidth || 1920;
      rawCanvas.height = video.videoHeight || 1080;
      const ctx = rawCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0, rawCanvas.width, rawCanvas.height);

      stopCamera();
      setupImageForCrop(rawCanvas);
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.style.display = "none";
      btnCapture.style.display = "none";
      ensureFullscreenPersistent();
    }

    // 6. Setup for Crop & Auto Detect Corners
    function setupImageForCrop(sourceElement) {
      rawCanvas.width = sourceElement.naturalWidth || sourceElement.videoWidth || sourceElement.width;
      rawCanvas.height = sourceElement.naturalHeight || sourceElement.videoHeight || sourceElement.height;
      const rCtx = rawCanvas.getContext('2d');
      rCtx.drawImage(sourceElement, 0, 0);

      placeholder.style.display = "none";
      outputCanvas.style.display = "none";
      cropCanvas.style.display = "block";

      cropCanvas.width = rawCanvas.width;
      cropCanvas.height = rawCanvas.height;

      detectDocumentCorners();
      drawCropInterface();
      attachPointDragger();

      inputActionGroup.style.display = "none";
      exportActionGroup.style.display = "none";
      filterBar.style.display = "none";
      confirmActionGroup.style.display = "flex";
      ensureFullscreenPersistent();
    }

    function detectDocumentCorners() {
      const w = rawCanvas.width;
      const h = rawCanvas.height;

      try {
        let src = cv.imread(rawCanvas);
        let gray = new cv.Mat();
        let blurred = new cv.Mat();
        let edged = new cv.Mat();

        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
        cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
        cv.Canny(blurred, edged, 50, 160);

        let kernel = cv.Mat.ones(3, 3, cv.CV_8U);
        cv.dilate(edged, edged, kernel);
        kernel.delete();

        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();
        cv.findContours(edged, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

        let maxArea = 0;
        let bestPoly = null;

        for (let i = 0; i < contours.size(); ++i) {
          let cnt = contours.get(i);
          let area = cv.contourArea(cnt);
          if (area > (w * h * 0.08)) {
            let peri = cv.arcLength(cnt, true);
            let approx = new cv.Mat();
            cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

            if (approx.rows === 4 && area > maxArea) {
              maxArea = area;
              if (bestPoly) bestPoly.delete();
              bestPoly = approx.clone();
            }
            approx.delete();
          }
        }

        if (bestPoly) {
          let pts = [];
          for (let i = 0; i < 4; i++) {
            pts.push({ x: bestPoly.data32S[i * 2], y: bestPoly.data32S[i * 2 + 1] });
          }
          corners = sortFourPoints(pts);
          bestPoly.delete();
        } else {
          corners = [
            { x: w * 0.08, y: h * 0.08 },
            { x: w * 0.92, y: h * 0.08 },
            { x: w * 0.92, y: h * 0.92 },
            { x: w * 0.08, y: h * 0.92 }
          ];
        }

        src.delete(); gray.delete(); blurred.delete(); edged.delete();
        contours.delete(); hierarchy.delete();
      } catch (e) {
        corners = [
          { x: w * 0.08, y: h * 0.08 },
          { x: w * 0.92, y: h * 0.08 },
          { x: w * 0.92, y: h * 0.92 },
          { x: w * 0.08, y: h * 0.92 }
        ];
      }
    }

    function sortFourPoints(pts) {
      pts.sort((a, b) => a.y - b.y);
      let top = [pts[0], pts[1]].sort((a, b) => a.x - b.x);
      let bottom = [pts[2], pts[3]].sort((a, b) => a.x - b.x);
      return [top[0], top[1], bottom[1], bottom[0]];
    }

    function drawCropInterface() {
      const ctx = cropCanvas.getContext('2d');
      ctx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
      ctx.drawImage(rawCanvas, 0, 0);

      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(rawCanvas, 0, 0);
      ctx.restore();

      ctx.strokeStyle = "#4f46e5";
      ctx.lineWidth = Math.max(cropCanvas.width * 0.005, 4);
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();
      ctx.stroke();

      const radius = Math.max(cropCanvas.width * 0.022, 16);
      corners.forEach((pt) => {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = radius * 0.35;
        ctx.strokeStyle = "#4f46e5";
        ctx.stroke();
      });
    }

    function attachPointDragger() {
      let isDragging = false;

      function getCoords(e) {
        const rect = cropCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = cropCanvas.width / rect.width;
        const scaleY = cropCanvas.height / rect.height;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function onStart(e) {
        const { x, y } = getCoords(e);
        const threshold = Math.max(cropCanvas.width * 0.09, 60);

        activeCornerIndex = -1;
        corners.forEach((pt, i) => {
          let dist = Math.hypot(pt.x - x, pt.y - y);
          if (dist < threshold) activeCornerIndex = i;
        });

        if (activeCornerIndex !== -1) {
          isDragging = true;
          e.preventDefault();
        }
      }

      function onMove(e) {
        if (!isDragging || activeCornerIndex === -1) return;
        const { x, y } = getCoords(e);
        corners[activeCornerIndex] = {
          x: Math.max(0, Math.min(cropCanvas.width, x)),
          y: Math.max(0, Math.min(cropCanvas.height, y))
        };
        drawCropInterface();
        e.preventDefault();
      }

      function onEnd() {
        isDragging = false;
        activeCornerIndex = -1;
      }

      cropCanvas.onmousedown = onStart;
      window.onmousemove = onMove;
      window.onmouseup = onEnd;

      cropCanvas.ontouchstart = onStart;
      window.ontouchmove = onMove;
      window.ontouchend = onEnd;
    }

    // 7. Apply Perspective Crop & Add to Multi-page Tray
    function applyPerspectiveCrop() {
      let src = cv.imread(rawCanvas);

      let [tl, tr, br, bl] = corners;
      let widthTop = Math.hypot(tr.x - tl.x, tr.y - tl.y);
      let widthBottom = Math.hypot(br.x - bl.x, br.y - bl.y);
      let maxWidth = Math.max(widthTop, widthBottom);

      let heightLeft = Math.hypot(tl.x - bl.x, tl.y - bl.y);
      let heightRight = Math.hypot(tr.x - br.x, tr.y - br.y);
      let maxHeight = Math.max(heightLeft, heightRight);

      let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
      let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, maxWidth, 0, maxWidth, maxHeight, 0, maxHeight]);

      let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
      let dst = new cv.Mat();
      cv.warpPerspective(src, dst, M, new cv.Size(maxWidth, maxHeight), cv.INTER_LANCZOS4, cv.BORDER_CONSTANT, new cv.Scalar());

      if (croppedMatColor) croppedMatColor.delete();
      croppedMatColor = dst.clone();

      cv.imshow(outputCanvas, dst);

      src.delete(); srcCoords.delete(); dstCoords.delete(); M.delete(); dst.delete();

      cropCanvas.style.display = "none";
      outputCanvas.style.display = "block";
      confirmActionGroup.style.display = "none";
      filterBar.style.display = "flex";
      exportActionGroup.style.display = "flex";

      applyFilter('color', false);

      // Save as new scanned page
      saveCurrentCanvasToPages();
      ensureFullscreenPersistent();
    }

    function saveCurrentCanvasToPages() {
      const dataUrl = outputCanvas.toDataURL('image/jpeg', 0.98);
      scannedPages.push({
        dataUrl: dataUrl,
        width: outputCanvas.width,
        height: outputCanvas.height
      });
      activePageIndex = scannedPages.length - 1;
      renderThumbnails();
    }

    // 8. Horizontal Touch-Scrollable Thumbnails Renderer
    function renderThumbnails() {
      pagesList.innerHTML = '';
      if (scannedPages.length === 0) {
        pagesTray.style.display = 'none';
        return;
      }

      pagesTray.style.display = 'flex';
      pageCount.innerText = scannedPages.length;

      scannedPages.forEach((page, idx) => {
        const item = document.createElement('div');
        item.className = `page-thumb-wrapper ${idx === activePageIndex ? 'active' : ''}`;
        item.onclick = (e) => {
          if (e.target.closest('.thumb-del-btn')) return;
          switchToPage(idx);
        };

        item.innerHTML = `
          <img src="${page.dataUrl}" alt="Page ${idx + 1}">
          <span class="thumb-badge">${idx + 1}</span>
          <button class="thumb-del-btn" onclick="deletePage(${idx})" title="Delete">✕</button>
        `;
        pagesList.appendChild(item);
      });

      // Auto scroll smoothly to the newly added thumbnail
      setTimeout(() => {
        pagesList.scrollTo({ left: pagesList.scrollWidth, behavior: 'smooth' });
      }, 50);
    }

    function switchToPage(index) {
      activePageIndex = index;
      renderThumbnails();

      const img = new Image();
      img.onload = () => {
        outputCanvas.width = img.naturalWidth;
        outputCanvas.height = img.naturalHeight;
        const ctx = outputCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        if (croppedMatColor) croppedMatColor.delete();
        croppedMatColor = cv.imread(outputCanvas);
      };
      img.src = scannedPages[index].dataUrl;
    }

    function deletePage(index) {
      scannedPages.splice(index, 1);
      if (scannedPages.length === 0) {
        resetAll();
      } else {
        activePageIndex = Math.max(0, index - 1);
        switchToPage(activePageIndex);
      }
    }

    function addNewPageCamera() {
      initCamera();
    }

    // 9. Document Enhancements & Filters
    function applyFilter(mode, shouldUpdatePage = true) {
      if (!croppedMatColor) return;

      document.getElementById('chipColor').classList.toggle('active', mode === 'color');
      document.getElementById('chipMagic').classList.toggle('active', mode === 'magic');
      document.getElementById('chipBw').classList.toggle('active', mode === 'bw');

      if (mode === 'color') {
        cv.imshow(outputCanvas, croppedMatColor);
      } else if (mode === 'magic') {
        let result = new cv.Mat();
        croppedMatColor.convertTo(result, -1, 1.25, 20);
        cv.imshow(outputCanvas, result);
        result.delete();
      } else if (mode === 'bw') {
        let gray = new cv.Mat();
        let bw = new cv.Mat();
        cv.cvtColor(croppedMatColor, gray, cv.COLOR_RGBA2GRAY, 0);
        cv.adaptiveThreshold(gray, bw, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 21, 12);
        cv.imshow(outputCanvas, bw);
        gray.delete(); bw.delete();
      }

      if (shouldUpdatePage && activePageIndex !== -1) {
        scannedPages[activePageIndex].dataUrl = outputCanvas.toDataURL('image/jpeg', 0.98);
        renderThumbnails();
      }
    }

    // 10. Multi-Page High-Res PDF (A4 Ratio Preserved)
    function buildMultiPagePdf() {
      const { jsPDF } = window.jspdf;
      if (scannedPages.length === 0) return null;

      let doc = null;

      scannedPages.forEach((page, index) => {
        const isLandscape = page.width > page.height;
        const orientation = isLandscape ? 'landscape' : 'portrait';

        if (index === 0) {
          doc = new jsPDF({
            orientation: orientation,
            unit: 'mm',
            format: 'a4',
            compress: true
          });
        } else {
          doc.addPage('a4', orientation);
        }

        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 8;

        const printableW = pageWidth - (margin * 2);
        const printableH = pageHeight - (margin * 2);

        let renderW = printableW;
        let renderH = (page.height * renderW) / page.width;

        if (renderH > printableH) {
          renderH = printableH;
          renderW = (page.width * renderH) / page.height;
        }

        const posX = margin + (printableW - renderW) / 2;
        const posY = margin + (printableH - renderH) / 2;

        doc.addImage(page.dataUrl, 'JPEG', posX, posY, renderW, renderH, undefined, 'FAST');
      });

      return doc;
    }

    function downloadPDF() {
      const doc = buildMultiPagePdf();
      if (!doc) return;
      doc.save(`Scan_${Date.now()}.pdf`);
    }

    async function sharePDF() {
      try {
        const doc = buildMultiPagePdf();
        if (!doc) return;
        const blob = doc.output('blob');
        const file = new File([blob], `Scan_${Date.now()}.pdf`, { type: 'application/pdf' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Scanned Document',
            text: 'Multi-page document scanned via DocScan Pro'
          });
        } else {
          downloadPDF();
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          downloadPDF();
        }
      }
    }

    function cancelCurrentCrop() {
      if (scannedPages.length > 0) {
        cropCanvas.style.display = "none";
        outputCanvas.style.display = "block";
        confirmActionGroup.style.display = "none";
        filterBar.style.display = "flex";
        exportActionGroup.style.display = "flex";
        switchToPage(activePageIndex);
      } else {
        resetAll();
      }
    }

    function resetAll() {
      if (croppedMatColor) {
        croppedMatColor.delete();
        croppedMatColor = null;
      }
      scannedPages = [];
      activePageIndex = -1;
      renderThumbnails();

      cropCanvas.style.display = "none";
      outputCanvas.style.display = "none";
      filterBar.style.display = "none";
      confirmActionGroup.style.display = "none";
      exportActionGroup.style.display = "none";
      placeholder.style.display = "flex";
      inputActionGroup.style.display = "flex";
      fileInput.value = "";
    }
  </script>
</body>
