<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocScan Pro | Smart Web Scanner</title>
  
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- OpenCV.js & jsPDF -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --surface: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(79, 70, 229, 0.2);
      border: 1px solid rgba(79, 70, 229, 0.4);
      font-size: 13px;
      font-weight: 500;
      color: #c7d2fe;
      margin-bottom: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      animation: pulse 1.5s infinite;
    }

    .dot.ready { background: var(--success); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Main Container */
    .app-card {
      width: 100%;
      max-width: 580px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Viewport Frame */
    .viewer {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, canvas, #previewImg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Controls Panel */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
      color: #e2e8f0;
    }
    .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }

    .btn-success {
      background: var(--success);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .btn-success:hover:not(:disabled) { background: #059669; }

    /* Hidden Canvas for computation */
    #hiddenCanvas {
      display: none;
    }

    /* Filters toggler bar */
    .filter-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-top: 4px;
    }

    .filter-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .filter-chip.active {
      background: rgba(79, 70, 229, 0.25);
      border-color: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="dot" id="cvStatusDot"></span>
      <span id="cvStatusText">Loading Vision AI Engine...</span>
    </div>
    <h1>Document Edge Scanner</h1>
  </header>

  <main class="app-card">
    <!-- Camera / Document Viewer -->
    <div class="viewer">
      <div id="placeholder" class="empty-state">
        <i data-lucide="camera" style="width: 36px; height: 36px;"></i>
        <span>Start camera or upload an image to begin</span>
      </div>

      <video id="video" autoplay playsinline></video>
      <img id="previewImg" alt="Input Document">
      <canvas id="outputCanvas"></canvas>
    </div>

    <!-- Hidden Work Canvas -->
    <canvas id="hiddenCanvas"></canvas>

    <!-- Filter chips (Cropped Result aane ke baad show hote hain) -->
    <div class="filter-bar" id="filterBar">
      <span class="filter-chip active" id="chipColor" onclick="applyFilter('color')">Color (Clean)</span>
      <span class="filter-chip" id="chipBw" onclick="applyFilter('bw')">B&W (High Contrast)</span>
    </div>

    <!-- Dynamic Actions Buttons -->
    <div class="controls">
      <!-- State 1: Input Actions -->
      <div class="btn-group" id="inputActionGroup">
        <button id="btnCamera" class="btn btn-primary" onclick="initCamera()" disabled>
          <i data-lucide="video"></i> Open Camera
        </button>
        <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()" id="btnUpload" disabled>
          <i data-lucide="upload"></i> Upload Image
        </button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
      </div>

      <!-- State 2: Capture Button -->
      <button id="btnCapture" class="btn btn-primary" onclick="captureAndDetect()" style="display: none;">
        <i data-lucide="scan-line"></i> Snap & Auto-Crop
      </button>

      <!-- State 3: Download / Retake Actions -->
      <div class="btn-group" id="exportActionGroup" style="display: none;">
        <button class="btn btn-secondary" onclick="retake()">
          <i data-lucide="rotate-ccw"></i> Retake
        </button>
        <button class="btn btn-success" onclick="downloadPDF()">
          <i data-lucide="file-down"></i> Download PDF
        </button>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const video = document.getElementById('video');
    const previewImg = document.getElementById('previewImg');
    const outputCanvas = document.getElementById('outputCanvas');
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    const placeholder = document.getElementById('placeholder');
    const filterBar = document.getElementById('filterBar');

    const btnCamera = document.getElementById('btnCamera');
    const btnUpload = document.getElementById('btnUpload');
    const btnCapture = document.getElementById('btnCapture');
    const inputActionGroup = document.getElementById('inputActionGroup');
    const exportActionGroup = document.getElementById('exportActionGroup');
    const fileInput = document.getElementById('fileInput');

    let stream = null;
    let croppedMatColor = null; // Stored for filter switching

    // 1. OpenCV Load Event
    function onOpenCvReady() {
      document.getElementById('cvStatusDot').classList.add('ready');
      document.getElementById('cvStatusText').innerText = "Vision AI Ready";
      btnCamera.disabled = false;
      btnUpload.disabled = false;
    }

    // 2. Camera Start
    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        video.srcObject = stream;
        video.style.display = "block";
        placeholder.style.display = "none";
        previewImg.style.display = "none";
        outputCanvas.style.display = "none";

        inputActionGroup.style.display = "none";
        btnCapture.style.display = "inline-flex";
      } catch (err) {
        alert("Camera access error: " + err.message);
      }
    }

    // 3. File Upload Handle
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        previewImg.src = event.target.result;
        previewImg.onload = () => {
          stopCamera();
          placeholder.style.display = "none";
          video.style.display = "none";
          outputCanvas.style.display = "none";
          previewImg.style.display = "block";

          // Seedha crop process trigger karein
          processSourceImage(previewImg);
        };
      };
      reader.readAsDataURL(file);
    });

    // 4. Photo Capture Button Event
    function captureAndDetect() {
      hiddenCanvas.width = video.videoWidth;
      hiddenCanvas.height = video.videoHeight;
      const ctx = hiddenCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

      stopCamera();
      processSourceImage(hiddenCanvas);
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      btnCapture.style.display = "none";
    }

    // 5. Image Processing & Edge Detection Pipeline
    function processSourceImage(sourceElement) {
      let src = cv.imread(sourceElement);
      let gray = new cv.Mat();
      let blurred = new cv.Mat();
      let edged = new cv.Mat();

      // Grayscale & Bilateral/Gaussian Filter
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
      cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);

      // Edge detection
      cv.Canny(blurred, edged, 50, 150);

      // Contours
      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();
      cv.findContours(edged, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

      let maxArea = 0;
      let documentCorners = null;

      for (let i = 0; i < contours.size(); ++i) {
        let contour = contours.get(i);
        let area = cv.contourArea(contour);

        if (area > 8000) {
          let peri = cv.arcLength(contour, true);
          let approx = new cv.Mat();
          cv.approxPolyDP(contour, approx, 0.02 * peri, true);

          if (approx.rows === 4 && area > maxArea) {
            maxArea = area;
            if (documentCorners) documentCorners.delete();
            documentCorners = approx.clone();
          }
          approx.delete();
        }
      }

      // Perspective Transform ya Fallback
      if (documentCorners) {
        let pts = [];
        for (let i = 0; i < 4; i++) {
          pts.push({ x: documentCorners.data32S[i * 2], y: documentCorners.data32S[i * 2 + 1] });
        }

        // 4 Points Sort: TL, TR, BR, BL
        pts.sort((a, b) => a.y - b.y);
        let topRow = [pts[0], pts[1]].sort((a, b) => a.x - b.x);
        let btmRow = [pts[2], pts[3]].sort((a, b) => a.x - b.x);

        let tl = topRow[0], tr = topRow[1], bl = btmRow[0], br = btmRow[1];

        let width = Math.max(Math.hypot(tr.x - tl.x, tr.y - tl.y), Math.hypot(br.x - bl.x, br.y - bl.y));
        let height = Math.max(Math.hypot(tl.x - bl.x, tl.y - bl.y), Math.hypot(tr.x - br.x, tr.y - br.y));

        let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
        let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, width, 0, width, height, 0, height]);

        let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
        let dst = new cv.Mat();
        cv.warpPerspective(src, dst, M, new cv.Size(width, height), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

        if (croppedMatColor) croppedMatColor.delete();
        croppedMatColor = dst.clone();

        cv.imshow(outputCanvas, dst);

        srcCoords.delete(); dstCoords.delete(); M.delete(); dst.delete();
        documentCorners.delete();
      } else {
        // Fallback: agar edges na milein toh original crop use karein
        if (croppedMatColor) croppedMatColor.delete();
        croppedMatColor = src.clone();
        cv.imshow(outputCanvas, src);
      }

      // Cleanup
      src.delete(); gray.delete(); blurred.delete(); edged.delete();
      contours.delete(); hierarchy.delete();

      // Show View
      video.style.display = "none";
      previewImg.style.display = "none";
      outputCanvas.style.display = "block";
      filterBar.style.display = "flex";
      exportActionGroup.style.display = "flex";
    }

    // 6. Filter Controls (Color vs B&W Scan)
    function applyFilter(type) {
      if (!croppedMatColor) return;

      document.getElementById('chipColor').classList.toggle('active', type === 'color');
      document.getElementById('chipBw').classList.toggle('active', type === 'bw');

      if (type === 'color') {
        cv.imshow(outputCanvas, croppedMatColor);
      } else {
        let bw = new cv.Mat();
        let gray = new cv.Mat();
        cv.cvtColor(croppedMatColor, gray, cv.COLOR_RGBA2GRAY, 0);
        // Adaptive threshold CamScanner jaisa high-contrast B&W look deta hai
        cv.adaptiveThreshold(gray, bw, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 21, 10);
        cv.imshow(outputCanvas, bw);
        gray.delete(); bw.delete();
      }
    }

    // 7. Retake / Reset
    function retake() {
      if (croppedMatColor) {
        croppedMatColor.delete();
        croppedMatColor = null;
      }
      outputCanvas.style.display = "none";
      filterBar.style.display = "none";
      exportActionGroup.style.display = "none";
      placeholder.style.display = "flex";
      inputActionGroup.style.display = "flex";
      fileInput.value = "";
    }

    // 8. PDF Download
    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      const imgData = outputCanvas.toDataURL('image/jpeg', 0.95);

      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      
      const margin = 10;
      const maxWidth = pageWidth - (margin * 2);
      const maxHeight = pageHeight - (margin * 2);

      let imgWidth = maxWidth;
      let imgHeight = (outputCanvas.height * imgWidth) / outputCanvas.width;

      if (imgHeight > maxHeight) {
        imgHeight = maxHeight;
        imgWidth = (outputCanvas.width * imgHeight) / outputCanvas.height;
      }

      doc.addImage(imgData, 'JPEG', margin, margin, imgWidth, imgHeight);
      doc.save(`Scanned_Doc_${Date.now()}.pdf`);
    }
  </script>
</body>
</html>
